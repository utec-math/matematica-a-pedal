<header style="font-family:'Roboto Mono', monospace;">

  <!-- PORTADA TIPOGRÁFICA -->
  <div class="hero"
       style="background:linear-gradient(105deg,#FFD580,#FFA559);
              border-bottom:2px solid #FFD580;">
    <div class="hero-inner"
         style="max-width:1180px;margin:0 auto;
                display:flex;align-items:center;justify-content:space-between;
                gap:24px; padding:28px 18px;">

      <!-- Texto -->
      <div class="hero-text" style="flex:1 1 auto;">
        <h1 style="margin:0;color:#783f04;
                   font-weight:800;line-height:1.1;
                   font-size:clamp(28px,5vw,52px);">
          Matemática a Pedal
        </h1>
        <p style="margin:6px 0 0;color:#7f6000;
                  font-size:clamp(14px,2.3vw,18px);max-width:640px;">
          Capítulos cortos, ejemplos claros y mini-apps interactivas para pedalear matemática a tu ritmo.
        </p>

        <!-- 🔐 BOTÓN CERTIFICADO -->
        <div style="margin-top:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <button id="btnCertLogin"
            style="background:#fff;border:1px solid #FFD580;color:#783f04;border-radius:10px;padding:8px 12px;cursor:pointer;">
            🎓 Ingresar para certificado
          </button>
          <span id="certStatus" style="color:#783f04; font-size:14px;"></span>
        </div>

        <div id="certMsg" style="color:#783f04; margin-top:6px; font-size:14px;"></div>
      </div>

      <!-- Imagen lateral -->
      <div class="hero-art"
           style="flex:0 0 320px; height:140px; display:flex; align-items:center; justify-content:center;">
        <img src="/matematica-a-pedal/assets/bici-espiral.png"
             alt="Bicicleta con espiral áurea"
             style="max-width:100%; max-height:100%; object-fit:contain;">
      </div>
    </div>
  </div>

  <!-- MENÚ HORIZONTAL -->
  <nav style="position:relative; z-index:50;
              background:#FFF6E6; border-top:1px solid #FFD580; border-bottom:1px solid #FFD580;">
    <div style="max-width:1180px; margin:0 auto;
                display:flex; justify-content:center; gap:16px; padding:10px 0; flex-wrap:wrap;">

      <a href="/matematica-a-pedal/index.html"
         style="background:#fff; border:1px solid #FFD580; color:#783f04;
                border-radius:10px; padding:8px 12px; text-decoration:none;">
        🏠 Inicio
      </a>

      <a href="/matematica-a-pedal/autodiagnostico.html"
         style="background:#fff; border:1px solid #FFD580; color:#783f04;
                border-radius:10px; padding:8px 12px; text-decoration:none;">
        🧠 Autodiagnóstico
      </a>

    </div>
  </nav>

</header>

<!-- MODAL CERTIFICADO -->
<div id="certModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:9999;">
  <div style="background:#fff; max-width:520px; margin:10vh auto; padding:16px; border-radius:14px; border:1px solid #FFD580;">
    <h3 style="margin:0 0 10px; color:#783f04;">Registro para certificado</h3>

    <label style="display:block; margin:10px 0 6px; color:#7f6000;">Curso / cohorte</label>
    <select id="cohortSelect" style="width:100%; padding:8px; border-radius:10px; border:1px solid #FFD580;"></select>

    <label style="display:block; margin:10px 0 6px; color:#7f6000;">Grupo (opcional)</label>
    <input id="groupInput" placeholder="Ej: Grupo A / Grupo 1"
           style="width:100%; padding:8px; border-radius:10px; border:1px solid #FFD580;" />

    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
      <button id="btnCertClose" style="background:#fff;border:1px solid #FFD580;color:#783f04;border-radius:10px;padding:8px 12px;cursor:pointer;">
        Cancelar
      </button>
      <button id="btnCertSave" style="background:#783f04;border:1px solid #783f04;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;">
        Guardar
      </button>
    </div>
  </div>
</div>

<style>
  @media (max-width: 720px){
    .hero-inner{ flex-direction:column; align-items:flex-start !important; }
    .hero-art{ display:none !important; }
  }
</style>
