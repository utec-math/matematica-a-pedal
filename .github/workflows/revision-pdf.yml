name: Revisar visualmente los solucionarios PDF
on:
  push:
    branches: [codex/revision-visual-pdf]
    paths: ['.github/workflows/revision-pdf.yml', 'descargas/*.pdf', 'solucionarios/**']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar el lector PDF
        run: python -m pip install pymupdf pillow
      - name: Crear vistas de todas las páginas
        run: |
          python - <<'PY'
          import fitz, json, hashlib
          from pathlib import Path
          from PIL import Image, ImageDraw
          out=Path('work/pdf-review')
          out.mkdir(parents=True,exist_ok=True)
          report=[]
          for n in range(1,5):
              path=Path(f'descargas/etapa-{n}-soluciones-paso-a-paso.pdf')
              doc=fitz.open(path)
              pages=[]
              pictures=[]
              for i,page in enumerate(doc):
                  pix=page.get_pixmap(matrix=fitz.Matrix(1.25,1.25),alpha=False)
                  pix.save(str(out/f'etapa-{n}-pagina-{i+1:02}.png'))
                  pictures.append(Image.frombytes('RGB',[pix.width,pix.height],pix.samples))
                  spans=[s for b in page.get_text('dict')['blocks'] if 'lines' in b for l in b['lines'] for s in l['spans']]
                  pages.append({'number':i+1,'width':page.rect.width,'height':page.rect.height,'spans':spans})
              for start in range(0,len(pictures),4):
                  w,h=pictures[start].size
                  sheet=Image.new('RGB',(w*2,h*2+40),'#eeeeee')
                  draw=ImageDraw.Draw(sheet)
                  draw.text((12,10),f'Etapa {n}: páginas {start+1}-{min(start+4,len(pictures))}',fill='#333333')
                  for k,img in enumerate(pictures[start:start+4]):
                      sheet.paste(img,((k%2)*w,40+(k//2)*h))
                  sheet.save(out/f'etapa-{n}-hoja-{start//4+1}.png')
              report.append({'unit':n,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'pages':pages})
          (out/'informe.json').write_text(json.dumps(report,ensure_ascii=False),encoding='utf8')
          PY
      - name: Guardar las vistas en la rama de revisión
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/pdf-review
          if ! git diff --cached --quiet; then
            git commit -m 'Generar vistas para la revisión visual de los PDF'
            git push
          fi
