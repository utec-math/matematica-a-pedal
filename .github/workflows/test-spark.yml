name: Verificar seguimiento Spark
on:
  push:
    branches: [codex/spark-seguimiento-docente]
  pull_request:
    paths: ['aula/**', 'spark/**', 'tests/spark-rules.test.cjs', 'firestore.spark.rules', 'firebase.spark.json', 'package.json', '.github/workflows/test-spark.yml']
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm test
      - run: npm run test:rules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-spark
          path: |
            firestore-debug.log
            firebase-debug.log
            package-lock.json
          if-no-files-found: ignore
