<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autodiagnóstico · Matemática a Pedal</title>
<link rel="stylesheet" href="https://utec-math.github.io/matematica-a-pedal/assets/style.css?v=3">
<style>
#autodiag-home{--ink:#783f04;--cream:#fffdf7;--soft:#fff6e6;--light:#ffe0a8;--gold:#ffd580;--orange:#ffa559;--body:#493726;--muted:#735b43;--line:#e9d6b7;--green:#235b37;--mint:#effff2;--red:#892d23;--pink:#ffecec}
#autodiag-home *{box-sizing:border-box}
#autodiag-home{margin:0;background:var(--soft);color:var(--body);font:1rem/1.55 "Segoe UI",Arial,sans-serif}
#autodiag-home button,#autodiag-home a,#autodiag-home input{font:inherit}
#autodiag-home button,#autodiag-home a{touch-action:manipulation}
#autodiag-home button{cursor:pointer}
#autodiag-home button:disabled{cursor:default;opacity:.45}
#autodiag-home a{color:var(--ink)}
#autodiag-home :focus-visible{outline:3px solid var(--ink);outline-offset:4px}
#autodiag-home [hidden]{display:none!important}
#autodiag-home.wrap{max-width:1190px;margin:auto;padding:34px 32px 48px}
#autodiag-home .hero{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:25px}
#autodiag-home h1,#autodiag-home h2,#autodiag-home h3,#autodiag-home p{margin-top:0}
#autodiag-home h1,#autodiag-home h2,#autodiag-home h3{color:var(--ink);line-height:1.16}
#autodiag-home h1{font-size:clamp(2.05rem,5vw,3.35rem);letter-spacing:-.052em;margin-bottom:8px}
#autodiag-home .intro{margin:0;color:var(--muted)}
#autodiag-home .progress{width:min(100%,280px);flex-shrink:0}
#autodiag-home .progress p{display:flex;justify-content:space-between;margin:0 0 7px;font-size:.86rem;color:var(--ink)}
#autodiag-home progress{display:block;width:100%;height:9px;appearance:none;border:0;background:#eedcc0;border-radius:20px;overflow:hidden}
#autodiag-home progress::-webkit-progress-bar{background:#eedcc0}
#autodiag-home progress::-webkit-progress-value{background:#ae5815;border-radius:20px}
#autodiag-home progress::-moz-progress-bar{background:#ae5815}
#autodiag-home .layout{display:grid;grid-template-columns:268px minmax(0,1fr);gap:22px;align-items:start}
#autodiag-home .route,#autodiag-home .card{background:var(--cream);border:1px solid var(--line);border-radius:20px}
#autodiag-home .route{padding:18px}
#autodiag-home .route h2{font-size:1rem;margin:0 0 12px}
#autodiag-home .group{padding:9px 0;border-top:1px solid #f1e4d0}
#autodiag-home .group-name{display:block;margin:0 0 6px;color:var(--muted);font-size:.82rem;font-weight:650}
#autodiag-home .stops{display:flex;gap:6px}
#autodiag-home .stop{display:grid;place-items:center;width:37px;height:34px;background:#fff;border:1px solid var(--line);border-radius:9px;color:var(--ink);font-size:.84rem;font-weight:650}
#autodiag-home .stop[data-status="respondida"]{background:var(--light);border-color:#bc7b2b}
#autodiag-home .stop[data-status="no-sabe"]{background:var(--soft);border:1px dashed #986329}
#autodiag-home .stop[aria-current="step"]{background:var(--ink);color:#fff;border-color:var(--ink)}
#autodiag-home .card{padding:clamp(19px,4vw,36px);min-width:0;box-shadow:0 8px 22px #783f0408}
#autodiag-home .context{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:0 0 13px;color:var(--ink);font-size:.85rem;font-weight:700}
#autodiag-home .topic{background:var(--light);border-radius:100px;padding:4px 11px}
#autodiag-home .question{font-size:clamp(1.36rem,3vw,1.95rem);letter-spacing:-.025em;margin:0 0 19px}
#autodiag-home fieldset{padding:0;border:0;margin:0;min-width:0}
#autodiag-home legend{font-size:.88rem;color:var(--muted);margin-bottom:8px;padding:0}
#autodiag-home .options{display:grid;gap:8px}
#autodiag-home .option{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;min-height:48px;padding:9px 13px;background:#fff;border:1px solid var(--line);border-radius:11px;cursor:pointer}
#autodiag-home .option:hover{border-color:#aa6f33}
#autodiag-home .option:has(input:checked){background:var(--soft);border-color:#9a531c;box-shadow:inset 0 0 0 1px #9a531c}
#autodiag-home .option:has(input:focus-visible){outline:3px solid var(--ink);outline-offset:2px}
#autodiag-home .option input{accent-color:var(--ink);width:18px;height:18px;margin:0}
#autodiag-home .option math{font-size:1.12em}
#autodiag-home .option.skip{margin-top:4px;background:var(--soft);border-style:dashed}
#autodiag-home .controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px;padding-top:17px;border-top:1px solid var(--line)}
#autodiag-home .btn{min-height:43px;padding:8px 15px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;font-weight:700}
#autodiag-home .btn.primary{background:var(--orange);border-color:#a95e27;color:#4b2500}
#autodiag-home .btn.primary:hover{background:var(--gold)}
#autodiag-home .btn.simple{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px}
#autodiag-home .btn:hover:not(:disabled){border-color:var(--ink)}
#autodiag-home .controls .right{display:flex;flex-wrap:wrap;justify-content:end;gap:8px}
#autodiag-home .summary-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
#autodiag-home .notice,#autodiag-home .review-panel{margin-top:17px}
#autodiag-home .notice{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:13px}
#autodiag-home .notice p:last-of-type{margin-bottom:8px}
#autodiag-home .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0 20px}
#autodiag-home .stat{border:1px solid var(--line);border-radius:11px;padding:9px 10px;background:#fff}
#autodiag-home .stat b{display:block;color:var(--ink);font-size:1.35rem}
#autodiag-home .stat span{font-size:.82rem;color:var(--muted)}
#autodiag-home .reco{background:var(--soft);border-radius:12px;padding:15px;margin-bottom:16px}
#autodiag-home .reco h3{margin:0 0 7px}
#autodiag-home .reco-list{padding:0;margin:0;list-style:none}
#autodiag-home .reco-list li{padding:10px 0;border-top:1px solid var(--line)}
#autodiag-home .reco-list li:first-child{border-top:0}
#autodiag-home .reco-list a{font-weight:700;text-underline-offset:3px}
#autodiag-home .reco-list p{margin:3px 0 0;font-size:.88rem;color:var(--muted)}
#autodiag-home .topic-result{border-top:1px solid var(--line);padding:9px 0}
#autodiag-home .topic-result h3{margin:0;font-size:1rem}
#autodiag-home .topic-result p{margin:4px 0 0;font-size:.88rem}
#autodiag-home details{border-bottom:1px solid var(--line);padding:10px 0}
#autodiag-home summary{font-weight:650;color:var(--ink);cursor:pointer}
#autodiag-home details p{margin:8px 0}
#autodiag-home .correct{color:var(--green)}
#autodiag-home .incorrect{color:var(--red)}
#autodiag-home .hint{color:var(--muted);font-size:.88rem}
@media(max-width:760px){#autodiag-home.wrap{padding-left:17px;padding-right:17px}#autodiag-home.wrap{padding-top:21px}#autodiag-home .hero{display:block}#autodiag-home .progress{margin-top:12px}#autodiag-home .layout{grid-template-columns:1fr;gap:13px}#autodiag-home .route{grid-row:2}#autodiag-home .route .groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:0 12px}}
@media(max-width:440px){#autodiag-home .controls{flex-wrap:wrap}#autodiag-home .controls .right{margin-left:auto}#autodiag-home .stats{grid-template-columns:1fr 1fr}#autodiag-home .context{font-size:.77rem}#autodiag-home .question{overflow-wrap:anywhere}}
@media print{#autodiag-home .route,#autodiag-home .progress,#autodiag-home .controls,#autodiag-home .summary-actions{display:none}#autodiag-home.wrap,#autodiag-home .card{padding:0;background:#fff;border:0;box-shadow:none}#autodiag-home .layout{display:block}}

#autodiag-home .card{margin:0;width:100%}
#autodiag-home :is(p,li){line-height:inherit}
#autodiag-home .reco-list a{text-decoration:underline}
@media print{#header-placeholder{display:none}}
</style>
</head>
<body>
<div id="header-placeholder"></div>
  <script src="/matematica-a-pedal/assets/load-header.js"></script>
<main class="wrap" id="autodiag-home">
  <div class="hero">
    <div><h1>Autodiagnóstico</h1><p class="intro">Identificá qué temas te conviene repasar. Respondé sin calculadora si podés y volvé a cualquier pregunta cuando quieras.</p></div>
    <div class="progress">
      <p><span>Tu avance</span><strong id="progress-text" aria-live="polite"></strong></p>
      <progress id="progress-bar" aria-label="Preguntas con una opción marcada" max="20" value="0"></progress>
    </div>
  </div>
  <div class="layout">
    <nav class="route" aria-label="Preguntas por tema">
      <h2>Tu recorrido</h2><div class="groups" id="groups"></div>
    </nav>
    <section class="card" id="quiz-panel" aria-labelledby="question-title">
      <div class="context"><span class="topic" id="topic"></span><span id="position"></span></div>
      <h2 class="question" id="question-title" tabindex="-1"></h2>
      <fieldset><legend>Elegí una opción.</legend><div class="options" id="options"></div></fieldset>
      <div class="controls">
        <button class="btn" id="previous">← Anterior</button>
        <div class="right">
          <button class="btn simple" id="results-early">Ver resultados</button>
          <button class="btn primary" id="next">Siguiente →</button>
        </div>
      </div>
      <div class="notice" id="finish-notice" hidden>
        <p id="pending-text" tabindex="-1"></p>
        <button class="btn" id="go-pending">Ir a la primera pendiente</button>
        <button class="btn primary" id="finish-anyway">Ver resultados</button>
      </div>
    </section>
    <section class="card" id="results-panel" aria-labelledby="results-title" hidden>
      <h2 class="question" id="results-title" tabindex="-1">Tu resultado</h2>
      <div class="stats" id="stats"></div>
      <div class="reco" id="recommendation"></div>
      <div id="topics-result"></div>
      <div class="summary-actions">
        <button class="btn primary" id="review-button" aria-expanded="false" aria-controls="review">Revisar respuestas</button>
        <button class="btn" id="resume">Volver a las preguntas</button>
        <button class="btn" id="print">Imprimir</button>
        <button class="btn simple" id="reset">Empezar de nuevo</button>
      </div>
      <div class="review-panel" id="review" hidden></div>
    </section>
  </div>
</main>
<script type="module" src="/matematica-a-pedal/assets/firebase-init.js"></script>
<script type="module" src="/matematica-a-pedal/assets/progress-sync.js"></script>

  {"prompt":"Expresá <math><mrow><msup><mn>150</mn><mo>°</mo></msup></mrow></math> en radianes.","options":["<math><mrow><mfrac><mrow><mi>π</mi></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></math>","<math><mrow><mfrac><mrow><mn>5</mn><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></math>","<math><mrow><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></math>","<math><mrow><mfrac><mrow><mn>3</mn><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></math>"],"answer":"b"},
  {"prompt":"El valor de <math><mrow><mi mathvariant=\"normal\">sin</mi><mo>(</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac><mo>)</mo></mrow></math> es:","options":["<math><mrow><mfrac><mrow><msqrt><mrow><mn>3</mn></mrow></msqrt></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></math>","<math><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></math>","<math><mrow><mfrac><mrow><msqrt><mrow><mn>2</mn></mrow></msqrt></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></math>","1"],"answer":"b"},
  {"prompt":"En un triángulo rectángulo, el ángulo agudo mide <math><mrow><msup><mn>30</mn><mo>°</mo></msup></mrow></math> y la hipotenusa mide 10. La longitud del cateto opuesto a ese ángulo es:","options":["5","<math><mrow><mn>5</mn><msqrt><mrow><mn>3</mn></mrow></msqrt></mrow></math>","10","<math><mrow><mfrac><mrow><mn>10</mn></mrow><mrow><msqrt><mrow><mn>3</mn></mrow></msqrt></mrow></mfrac></mrow></math>"],"answer":"a"},
  {"prompt":"Una función sinusoidal tiene período <math><mrow><mi>T</mi><mo>=</mo><mn>4</mn></mrow></math> segundos. ¿Cuál es su frecuencia?","options":["<math><mrow><mn>4</mn><mspace width=\"0.15em\"/><mtext>Hz</mtext></mrow></math>","<math><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mspace width=\"0.15em\"/><mtext>Hz</mtext></mrow></math>","<math><mrow><mn>2</mn><mspace width=\"0.15em\"/><mtext>Hz</mtext></mrow></math>","<math><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mspace width=\"0.15em\"/><mtext>Hz</mtext></mrow></math>"],"answer":"b"},
  {"prompt":"Calculá <math><mrow><msup><mn>2</mn><mn>3</mn></msup><mo>·</mo><msup><mn>2</mn><mn>4</mn></msup></mrow></math>","options":["<math><mrow><msup><mn>2</mn><mn>7</mn></msup><mo>=</mo><mn>128</mn></mrow></math>","<math><mrow><msup><mn>2</mn><mrow><mn>12</mn></mrow></msup><mo>=</mo><mn>4096</mn></mrow></math>","<math><mrow><msup><mn>2</mn><mrow><mn>1</mn></mrow></msup><mo>=</mo><mn>2</mn></mrow></math>","<math><mrow><msup><mn>2</mn><mrow><mn>4</mn></mrow></msup><mo>·</mo><msup><mn>2</mn><mrow><mn>3</mn></mrow></msup><mo>=</mo><mn>24</mn></mrow></math>"],"answer":"a"},
  {"prompt":"El valor de <math><mrow><mroot><mrow><mn>8</mn></mrow><mrow><mn>3</mn></mrow></mroot></mrow></math> es:","options":["2","4","<math><mrow><msqrt><mrow><mn>8</mn></mrow></msqrt></mrow></math>","<math><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></math>"],"answer":"a"},
  {"prompt":"Escribí <math><mrow><mn>0,00045</mn></mrow></math> en notación científica.","options":["<math><mrow><mn>4,5</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>3</mn></mrow></msup></mrow></math>","<math><mrow><mn>4,5</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>4</mn></mrow></msup></mrow></math>","<math><mrow><mn>45</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>5</mn></mrow></msup></mrow></math>","<math><mrow><mn>0,45</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>4</mn></mrow></msup></mrow></math>"],"answer":"b"},
  {"prompt":"El número <math><mrow><mn>5</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>2</mn></mrow></msup></mrow></math> es igual a:","options":["0,5","0,05","5","<math><mrow><mn>5</mn><mo>×</mo><mn>100</mn></mrow></math>"],"answer":"b"}
];

const byId = id => document.getElementById(id);
const letters = 'abcd';
const answers = Array(questions.length).fill(null);
const routeButtons = [];
let position = 0;

function answerStatus(question, answer) {
  if (answer === null) return 'pending';
  if (answer === 'unknown') return 'unknown';
  return answer === question.answer ? 'correct' : 'incorrect';
}

function summarize(currentAnswers) {
  const totals = {correct: 0, incorrect: 0, unknown: 0, pending: 0};
  const blocks = topics.map(() => ({correct: 0, incorrect: 0, unknown: 0, pending: 0}));
  questions.forEach((question, index) => {
    const status = answerStatus(question, currentAnswers[index]);
    totals[status]++;
    blocks[Math.floor(index / 4)][status]++;
  });
  return {totals, blocks};
}

function suggestReviews(currentAnswers) {
  const review = new Map();
  currentAnswers.forEach((answer, index) => {
    const status = answerStatus(questions[index], answer);
    if (status !== 'incorrect' && status !== 'unknown') return;
    const topic = questionReviewTopics[index];
    if (!review.has(topic)) review.set(topic, {incorrect: 0, unknown: 0});
    review.get(topic)[status]++;
  });
  return [...review].sort(([, a], [, b]) => (b.incorrect + b.unknown) - (a.incorrect + a.unknown));
}

function reviewLinks(entries) {
  return '<ul class="reco-list">' + entries.map(([key, signals]) => {
    const [name, path, tip] = reviewTopics[key];
    const reasons = [];
    if (signals.incorrect) reasons.push(signals.incorrect === 1 ? '1 respuesta para revisar' : signals.incorrect + ' respuestas para revisar');
    if (signals.unknown) reasons.push(signals.unknown + ' «No sé»');
    return '<li><a href="' + unitBase + path + '" target="_blank" rel="noopener">' + name +
      '</a><p>' + reasons.join(' · ') + '</p>' + (tip ? '<p>' + tip + '</p>' : '') + '</li>';
  }).join('') + '</ul>';
}

function refreshProgress() {
  const count = answers.filter(answer => answer !== null).length;
  byId('progress-bar').value = count;
  byId('progress-text').textContent = count + ' de ' + questions.length;
  routeButtons.forEach((button, index) => {
    const status = answers[index] === null ? 'pendiente' : answers[index] === 'unknown' ? 'no-sabe' : 'respondida';
    button.dataset.status = status;
    button.setAttribute('aria-label', 'Pregunta ' + (index + 1) + ', ' + (status === 'no-sabe' ? 'No sé' : status));
    if (index === position && !byId('quiz-panel').hidden) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
}

function showQuestion(index, focus = true) {
  position = index;
  byId('results-panel').hidden = true;
  byId('quiz-panel').hidden = false;
  byId('finish-notice').hidden = true;
  const question = questions[index];
  byId('topic').textContent = topics[Math.floor(index / 4)];
  byId('position').textContent = 'Pregunta ' + (index + 1) + ' de ' + questions.length;
  byId('question-title').innerHTML = question.prompt;
  byId('options').innerHTML = '';
  const values = [...letters, 'unknown'];
  values.forEach((value, choice) => {
    const label = document.createElement('label');
    label.className = value === 'unknown' ? 'option skip' : 'option';
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'answer';
    radio.value = value;
    radio.checked = answers[index] === value;
    radio.addEventListener('change', () => {
      answers[index] = value;
      byId('finish-notice').hidden = true;
      refreshProgress();
    });
    const text = document.createElement('span');
    text.innerHTML = value === 'unknown' ? 'No sé' : question.options[choice];
    label.append(radio, text);
    byId('options').append(label);
  });
  byId('previous').disabled = index === 0;
  byId('next').textContent = index === questions.length - 1 ? 'Ver resultados' : 'Siguiente →';
  byId('results-early').hidden = index === questions.length - 1;
  refreshProgress();
  if (focus) byId('question-title').focus();
}

function requestResults() {
  const pending = answers.filter(answer => answer === null).length;
  if (!pending) {
    showResults();
    return;
  }
  byId('pending-text').textContent = pending === 1 ? 'Queda una pregunta pendiente.' : 'Quedan ' + pending + ' preguntas pendientes.';
  byId('finish-notice').hidden = false;
  byId('pending-text').focus();
}

function showResults() {
  byId('quiz-panel').hidden = true;
  byId('results-panel').hidden = false;
  byId('review').hidden = true;
  byId('review-button').setAttribute('aria-expanded', 'false');
  const {totals, blocks} = summarize(answers);
  const labels = {correct: 'Correctas', incorrect: 'Para revisar', unknown: 'No sé', pending: 'Sin responder'};
  byId('stats').innerHTML = Object.keys(labels).map(status =>
    '<div class="stat"><b>' + totals[status] + '</b><span>' + labels[status] + '</span></div>'
  ).join('');

  const suggestions = suggestReviews(answers);
  const recommendation = byId('recommendation');

  if (suggestions.length) {
    const remaining = suggestions.slice(3);
    recommendation.innerHTML = '<h3>Por dónde seguir</h3>' + reviewLinks(suggestions.slice(0, 3)) +
      (remaining.length ? '<details><summary>Otros temas para repasar</summary>' + reviewLinks(remaining) + '</details>' : '');
  } else {
    recommendation.textContent = totals.pending === questions.length ? 'Respondé algunas preguntas para recibir una sugerencia.' :
      totals.pending > 0 ? 'Podés completar las preguntas pendientes para revisar los otros temas.' :
      'Resolviste las 20 preguntas. Podés seguir con tu ruta de Matemática a Pedal.';
  }

  byId('topics-result').innerHTML = topics.map((topic, index) => {
    const block = blocks[index];
    return '<div class="topic-result"><h3>' + topic + '</h3><p>' + block.correct +
      ' de 4 correctas · ' + block.incorrect + ' para revisar · ' + block.unknown +
      ' «No sé» · ' + block.pending + ' sin responder</p></div>';
  }).join('');

  byId('review').innerHTML = questions.map((question, index) => {
    const answer = answers[index];
    const status = answerStatus(question, answer);
    const statusText = {correct: 'Correcta', incorrect: 'Para revisar', unknown: 'No sé', pending: 'Sin responder'};
    const chosen = letters.includes(answer ?? 'unknown') ? question.options[letters.indexOf(answer)] : '';
    return '<details><summary>Pregunta ' + (index + 1) + ' · ' + statusText[status] +
      '</summary><p>' + question.prompt + '</p>' +
      (chosen && status === 'incorrect' ? '<p class="incorrect">Tu respuesta ' + chosen + '</p>' : '') +
      '<p class="correct">Respuesta correcta ' + question.options[letters.indexOf(question.answer)] + '</p></details>';
  }).join('');
  refreshProgress();
  byId('results-title').focus();
}

topics.forEach((topic, blockIndex) => {
  const group = document.createElement('div');
  group.className = 'group';
  const name = document.createElement('span');
  name.className = 'group-name';
  name.textContent = topic;
  const stops = document.createElement('div');
  stops.className = 'stops';
  questions.slice(blockIndex * 4, blockIndex * 4 + 4).forEach((_, item) => {
    const index = blockIndex * 4 + item;
    const button = document.createElement('button');
    button.className = 'stop';
    button.textContent = index + 1;
    button.addEventListener('click', () => showQuestion(index));
    stops.append(button);
    routeButtons.push(button);
  });
  group.append(name, stops);
  byId('groups').append(group);
});

byId('previous').addEventListener('click', () => showQuestion(position - 1));
byId('next').addEventListener('click', () => position === questions.length - 1 ? requestResults() : showQuestion(position + 1));
byId('results-early').addEventListener('click', requestResults);
byId('go-pending').addEventListener('click', () => showQuestion(answers.indexOf(null)));
byId('finish-anyway').addEventListener('click', showResults);
byId('resume').addEventListener('click', () => showQuestion(position));
byId('print').addEventListener('click', () => window.print());
byId('reset').addEventListener('click', () => {
  if (!window.confirm('¿Empezar de nuevo y borrar tus respuestas de esta prueba?')) return;
  answers.fill(null);
  showQuestion(0);
});
byId('review-button').addEventListener('click', () => {
  const review = byId('review');
  review.hidden = !review.hidden;
  byId('review-button').setAttribute('aria-expanded', String(!review.hidden));
  if (!review.hidden) review.querySelector('summary')?.focus();
});

showQuestion(0, false);
})();
</script>
